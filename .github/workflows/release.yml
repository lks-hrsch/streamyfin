name: 🚀 Release

# On merge to main, build every target on its runner and upload it to the store.
# Each target is gated by its OWN GitHub Environment approval, so any subset can
# be approved independently in "Review pending deployments":
#   1. iOS phone → TestFlight   [production-ios]   self-hosted Mac, fastlane
#   2. tvOS      → TestFlight   [production-tvos]  self-hosted Mac, fastlane
#   3. Mac       → TestFlight   [production-macos] self-hosted Mac, fastlane (Mac Catalyst)
# Android is not migrated yet; it gets its own matrix entries and a
# `platform :android` block in fastlane/Fastfile. See docs/ci.md.
#
# Never add a pull_request trigger: the self-hosted runner executes whatever the
# checkout contains, so it must only build code a maintainer pushed.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign, but skip the store upload
        type: boolean
        default: false

jobs:
  build:
    name: 🚀 ${{ matrix.name }}
    # A manual run from another branch would read the 1Password secrets too.
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    # Per-target approval gate: each matrix job waits on its own environment,
    # so individual targets can be approved/rejected independently.
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 🍎 iOS
            platform: ios
            target: ios
            profile: production
            runner: [self-hosted, macOS, ARM64, xcode-27.1]
            environment: production-ios
          - name: 📺 tvOS
            platform: ios
            target: tvos
            profile: production_tv
            runner: [self-hosted, macOS, ARM64, xcode-27.1]
            environment: production-tvos
          - name: 🖥️ macOS
            platform: ios
            target: mac
            profile: production
            runner: [self-hosted, macOS, ARM64, xcode-27.1]
            environment: production-macos
    env:
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      DEVELOPER_DIR: /Applications/Xcode-27.1.app/Contents/Developer
      # utils/version.ts shows the plain store version only for a production profile.
      EXPO_PUBLIC_BUILD_PROFILE: ${{ matrix.profile }}
      EXPO_TV: ${{ matrix.target == 'tvos' && '1' || '0' }}
      # app.config.ts adds the Mac Catalyst plugin at prebuild (bun run prebuild:mac).
      STREAMYFIN_MAC_CATALYST: ${{ matrix.target == 'mac' && '1' || '0' }}
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          show-progress: false

      # The Mac's PATH puts Nix's GNU tar first. The 1Password action unpacks its
      # macOS .pkg (a cpio payload) with `tar`, which only macOS's bsdtar reads.
      - name: 🔧 Use macOS tar
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bsdtar"
          ln -sf /usr/bin/tar "$RUNNER_TEMP/bsdtar/tar"
          echo "$RUNNER_TEMP/bsdtar" >> "$GITHUB_PATH"

      # No export-env: the values stay step outputs (masked) and are passed only
      # to the steps that need them. An exported value would reach every later
      # step, including `bun install` and its third-party install scripts.
      - name: 🔐 Load secrets from 1Password
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ASC_KEY_ID: op://ci-streamyfin/asc-api-key/key-id
          ASC_ISSUER_ID: op://ci-streamyfin/asc-api-key/issuer-id
          ASC_KEY_P8: op://ci-streamyfin/asc-api-key/credential

      # Separate step: Android jobs must not load the Apple signing identity.
      - name: 🔐 Load Apple signing secrets from 1Password
        id: op_apple
        if: matrix.platform == 'ios'
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DIST_P12_B64: op://ci-streamyfin/apple-distribution/p12-base64
          DIST_P12_PW: op://ci-streamyfin/apple-distribution/credential

      # The Mac's App Store export is a .pkg, signed with its own installer certificate.
      - name: 🔐 Load Mac installer certificate from 1Password
        id: op_mac
        if: matrix.target == 'mac'
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          MAC_INSTALLER_P12_B64: op://ci-streamyfin/macos-distribution/p12-base64
          MAC_INSTALLER_P12_PW: op://ci-streamyfin/macos-distribution/credential

      # bun, node, fastlane and cocoapods come from the flake's devShell, pinned
      # by flake.lock, the same toolchain as local development.
      - name: 📦 Install dependencies
        run: nix develop --command bun install --frozen-lockfile

      # Appends IOS_BUILD_NUMBER to GITHUB_ENV; app.config.ts reads it at prebuild.
      - name: 🔢 Next TestFlight build number
        if: matrix.platform == 'ios'
        env:
          ASC_KEY_ID: ${{ steps.op.outputs.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ steps.op.outputs.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ steps.op.outputs.ASC_KEY_P8 }}
        run: nix develop --command fastlane ios build_number target:${{ matrix.target }}

      # MPVKit's release has no Catalyst slice. This derives one from the iOS slice
      # into node_modules/.cache, where the Mac prebuild points the pod.
      - name: 🧬 Derive MPVKit's Mac Catalyst slice
        if: matrix.target == 'mac'
        run: nix develop --command bun scripts/ios/mpvkit-catalyst.ts

      - name: 🛠️ Generate native project
        run: nix develop --command bun x expo prebuild --platform ${{ matrix.platform }} --clean --no-install

      - name: 🍫 Install CocoaPods
        if: matrix.platform == 'ios'
        run: nix develop --command pod install --project-directory=ios

      # ── Build, sign and upload to the store ──
      # KC_PW locks the per-run signing keychain, which is deleted afterwards.
      - name: 🚀 Build & submit (${{ matrix.name }})
        env:
          ASC_KEY_ID: ${{ steps.op.outputs.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ steps.op.outputs.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ steps.op.outputs.ASC_KEY_P8 }}
          DIST_P12_B64: ${{ steps.op_apple.outputs.DIST_P12_B64 }}
          DIST_P12_PW: ${{ steps.op_apple.outputs.DIST_P12_PW }}
          MAC_INSTALLER_P12_B64: ${{ steps.op_mac.outputs.MAC_INSTALLER_P12_B64 }}
          MAC_INSTALLER_P12_PW: ${{ steps.op_mac.outputs.MAC_INSTALLER_P12_PW }}
        run: |
          KC_PW="$(openssl rand -hex 24)" nix develop --command \
            fastlane ${{ matrix.platform }} release target:${{ matrix.target }} dry_run:${{ env.DRY_RUN }}

      # The lane deletes it too; this covers a cancelled or killed run. The default
      # keychain is left alone: the runner user has no login keychain to point it
      # at, and each lane sets its own default and restores the previous one.
      - name: 🧹 Remove temporary keychain
        if: always() && matrix.platform == 'ios'
        run: security delete-keychain "ci-signing-${{ github.run_id }}-${{ matrix.target }}.keychain-db" 2>/dev/null || true

      # Also on failure: a signed .ipa (the Mac's .pkg) whose TestFlight upload failed
      # can be uploaded by hand instead of rebuilding.
      - name: 📤 Upload package (${{ matrix.name }})
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: streamyfin-${{ matrix.target }}
          path: |
            build/${{ matrix.target }}/*.ipa
            build/${{ matrix.target }}/*.pkg
          if-no-files-found: ignore
          retention-days: 14

      # fastlane's summary hides codesign errors; the full xcodebuild log has them.
      - name: 📤 Upload build logs
        if: failure() && matrix.platform == 'ios'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-${{ matrix.target }}
          path: ~/Library/Logs/gym/
          retention-days: 7
